# .github/workflows/daily-sync.yml
#
# Self-healing scheduled sync. Pings the Netlify Build Hook once a day (06:15 ET)
# to trigger a Netlify rebuild. The build runs scripts/build-data.js which
# pulls from Airtable and regenerates selected-works.json, copy.json,
# featured-essays.json, and otw-pieces.json.
# Net effect: any new Airtable content shows up on the site within a day,
# with no manual deploy.
#
# CADENCE, and why it is not more often (2026-08-22): this hook fires
# UNCONDITIONALLY. It does not check whether anything actually changed, so every
# run is a full paid Netlify rebuild of a site that is usually identical to the
# one already deployed. At every six hours that was 4 rebuilds a day per site,
# 12 a day across the three sites, and it was driving repeated $10 credit
# top-ups. Lisa's own pushes already trigger their own build through Netlify's
# git integration, so this cron only exists to catch content that changes
# OUTSIDE the repo. Do not raise this frequency without a reason; the real
# upgrade is to make the hook conditional on a content change, not to run it
# more often.
#
# Self-healing properties:
#   - Cron runs once a day.
#   - The curl call retries up to 3 times.
#   - On hard failure, a GitHub issue is opened automatically.
#   - workflow_dispatch lets anyone with repo access trigger an immediate run.

name: Scheduled site sync

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook (with retry)
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set."
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            if curl --fail --silent --show-error --max-time 30 \
                    -X POST -d {} \
                    "${{ secrets.NETLIFY_BUILD_HOOK }}"; then
              echo "Build hook triggered successfully on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Build hook failed after 3 attempts."
          exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[auto] Daily site sync failed on ${new Date().toISOString().slice(0, 10)}`,
              body: 'The scheduled site sync workflow failed. Run: ' + runUrl + '. Most common cause: NETLIFY_BUILD_HOOK secret is missing or revoked. The next scheduled run will try again automatically.',
              labels: ['automation', 'site-sync'],
            });
